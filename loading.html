<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{height:100%;margin:0;background:#0B1220;color:#E6EAF2;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;}
  .box{text-align:center}
  .ring{width:44px;height:44px;margin:0 auto 20px;border-radius:50%;
    border:3px solid rgba(77,107,254,.25);border-top-color:#4D6BFE;
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:17px;font-weight:600;margin:0 0 8px}
  p{font-size:12.5px;color:#8A93A6;margin:0;max-width:420px;line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <h1>DeepSeekHarness桌面版</h1>
    <p id="status">正在启动 Harness（首次启动约需 5~15 秒）…</p>
  </div>
</body>
</html>
